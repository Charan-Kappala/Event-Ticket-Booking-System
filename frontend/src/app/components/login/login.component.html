<div class="login-wrapper">
  <!-- Ambient background glow spheres -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-icon-box">
        <i class="fa-solid fa-ticket-simple"></i>
      </div>
      <h1 class="brand-title">EventPass</h1>
      <p class="brand-subtitle">Seamless access to premium live events</p>
    </div>

    <div class="card-content">
      <h2 class="form-title">Welcome Back</h2>
      <p class="form-sub">Enter your credentials to access your account</p>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="input-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input 
              type="email" 
              id="email" 
              [(ngModel)]="email" 
              name="email" 
              required
              placeholder="name@example.com"
              autocomplete="email">
          </div>
        </div>
        
        <div class="input-group">
          <div class="label-row">
            <label for="password">Password</label>
          </div>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input 
              type="password" 
              id="password" 
              [(ngModel)]="password" 
              name="password" 
              required
              placeholder="••••••••"
              autocomplete="current-password">
          </div>
        </div>

        <div *ngIf="errorMessage" class="error-banner">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <button type="submit" class="submit-button" [disabled]="isLoading || !loginForm.form.valid">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="btn-loader">
            <i class="fa-solid fa-circle-notch fa-spin"></i> Signing in...
          </span>
          <i *ngIf="!isLoading" class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="register-prompt">
        <span>Don't have an account?</span>
        <a routerLink="/register">Create an account</a>
      </div>

      <!-- Quick 1-Click Demo Logins -->
      <div class="quick-credentials">
        <div class="divider">
          <span>1-Click Demo Login</span>
        </div>
        <div class="credential-chips">
          <button type="button" class="cred-chip" (click)="quickFill('admin')" [disabled]="isLoading">
            <span class="cred-badge admin">ADMIN</span>
            <span class="cred-email">admin&#64;demo.test</span>
          </button>
          <button type="button" class="cred-chip" (click)="quickFill('organizer')" [disabled]="isLoading">
            <span class="cred-badge org">ORGANIZER</span>
            <span class="cred-email">organizer&#64;demo.test</span>
          </button>
          <button type="button" class="cred-chip" (click)="quickFill('user')" [disabled]="isLoading">
            <span class="cred-badge user">CUSTOMER</span>
            <span class="cred-email">alice&#64;demo.test</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
