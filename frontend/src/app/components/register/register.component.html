<div class="register-wrapper">
  <!-- Ambient background glow spheres -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="register-card">
    <div class="brand-header">
      <div class="brand-icon-box">
        <i class="fa-solid fa-sparkles"></i>
      </div>
      <h1 class="brand-title">EventPass</h1>
      <p class="brand-subtitle">Create an account to reserve and manage event tickets</p>
    </div>

    <div class="card-content">
      <h2 class="form-title">Join EventPass</h2>
      <p class="form-sub">Start discovering world-class live experiences today</p>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <div class="input-group">
          <label for="name">Full Name</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user input-icon"></i>
            <input 
              type="text" 
              id="name" 
              [(ngModel)]="userData.name" 
              name="name" 
              required
              placeholder="Alex Morgan"
              autocomplete="name">
          </div>
        </div>
        
        <div class="input-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input 
              type="email" 
              id="email" 
              [(ngModel)]="userData.email" 
              name="email" 
              required
              placeholder="alex@example.com"
              autocomplete="email">
          </div>
        </div>

        <div class="form-row">
          <div class="input-group half">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input 
                type="password" 
                id="password" 
                [(ngModel)]="userData.password" 
                name="password" 
                required
                placeholder="Min 6 chars"
                (input)="validatePasswords()"
                autocomplete="new-password">
            </div>
          </div>

          <div class="input-group half">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-shield-check input-icon"></i>
              <input 
                type="password" 
                id="confirmPassword" 
                [(ngModel)]="confirmPassword" 
                name="confirmPassword" 
                required
                placeholder="Repeat password"
                (input)="validatePasswords()"
                autocomplete="new-password">
            </div>
          </div>
        </div>

        <div *ngIf="passwordError" class="validation-warning">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>{{ passwordError }}</span>
        </div>

        <!-- Account Role Selection -->
        <div class="input-group">
          <label for="role">Account Type</label>
          <div class="role-selector">
            <label class="role-option" [class.selected]="userData.role === 'USER'">
              <input type="radio" [(ngModel)]="userData.role" name="role" value="USER" />
              <div class="role-content">
                <i class="fa-solid fa-ticket"></i>
                <div class="role-text">
                  <span class="role-title">Event Attendee</span>
                  <span class="role-desc">Browse & book tickets</span>
                </div>
              </div>
            </label>
            <label class="role-option" [class.selected]="userData.role === 'ORGANIZER'">
              <input type="radio" [(ngModel)]="userData.role" name="role" value="ORGANIZER" />
              <div class="role-content">
                <i class="fa-solid fa-calendar-star"></i>
                <div class="role-text">
                  <span class="role-title">Event Organizer</span>
                  <span class="role-desc">Publish & manage events</span>
                </div>
              </div>
            </label>
          </div>
        </div>

        <div *ngIf="errorMessage" class="error-banner">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <button 
          type="submit" 
          class="submit-button" 
          [disabled]="!registerForm.form.valid || isLoading || passwordError">
          <span *ngIf="!isLoading">Create Account</span>
          <span *ngIf="isLoading" class="btn-loader">
            <i class="fa-solid fa-circle-notch fa-spin"></i> Creating account...
          </span>
          <i *ngIf="!isLoading" class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="login-prompt">
        <span>Already have an account?</span>
        <a routerLink="/login">Sign In</a>
      </div>
    </div>
  </div>
</div>
