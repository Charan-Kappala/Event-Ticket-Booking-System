spring.application.name=ticket-booking-system
# src/main/resources/application.properties

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ticket_booking_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
# Flyway (src/main/resources/db/migration) owns the schema; Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a DB connection for the whole HTTP request, only for each transaction.
# (With it on, a request can hold one pooled connection while waiting for a second.)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Server Configuration
server.port=8080

# JWT signing secret: from the environment only (no default, so the app won't start without it).
# Must be at least 32 bytes. See .env.example.
jwt.secret=${JWT_SECRET}
jwt.expiration=PT24H

# Stripe configuration
stripe.api.key=your_stripe_api_key
stripe.webhook.secret=your_stripe_webhook_secret

# Logging. To see SQL while debugging: logging.level.org.hibernate.SQL=DEBUG
# (Avoid TRACE on org.hibernate.orm.jdbc.bind: it logs every bound value.)
logging.level.com.ticketbooking=INFO

# Seat holds: a new booking holds its seats this long; the expiry job checks this often
booking.hold-duration=PT5M
booking.hold-sweep-interval=PT5S
